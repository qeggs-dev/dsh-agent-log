<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作区日志</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<aside id="sidebar">
  <header>
    <div class="brand">
      <h1>工作区日志</h1>
      <button id="settingsBtn" type="button" aria-expanded="false" title="设置">⚙</button>
    </div>
    <p id="latest" class="muted">加载中…</p>
    <p id="updated" class="muted"></p>
    <div id="settings" class="settings" hidden>
      <p class="settings-title">主题</p>
      <div id="themes" class="themes"></div>
      <p class="settings-note">设置保存在本机浏览器；主题没有「关闭」项，随时可换。</p>
    </div>
  </header>
  <nav id="days" aria-label="日期"></nav>
</aside>

<main id="main">
  <article id="day">
    <p class="muted">加载中…</p>
  </article>
</main>

<script type="module" src="assets/app.js"></script>
</body>
</html>
