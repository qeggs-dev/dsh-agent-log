<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作区日志</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<aside id="sidebar">
  <header>
    <div class="brand">
      <img class="logo" src="assets/logo.svg" alt="" width="24" height="24">
      <h1>工作区日志</h1>
      <button id="settingsBtn" type="button" aria-expanded="false" title="设置">⚙</button>
    </div>
    <p id="latest" class="muted">加载中…</p>
    <p id="updated" class="muted"></p>
    <div class="search-wrap">
      <input id="searchInput" class="search-input" type="search"
             placeholder="全站搜索（/ 聚焦）" autocomplete="off" spellcheck="false">
    </div>
    <div id="settings" class="settings" hidden>
      <p class="settings-title">主题</p>
      <div id="themes" class="themes"></div>
      <p class="settings-note">设置保存在本机浏览器；主题没有「关闭」项，随时可换。</p>
    </div>
  </header>
  <nav id="days" aria-label="日期"></nav>
</aside>

<aside id="entries" aria-label="当日条目">
  <div class="entries-head">
    <h2 id="dayDate"></h2>
    <p id="dayMeta" class="muted"></p>
    <input id="searchInput2" class="search-input" type="search"
           placeholder="搜索标题 / 项目 / 关键词" autocomplete="off" spellcheck="false">
    <img id="overview" class="overview" alt="当日概览" hidden>
  </div>
  <nav id="items"></nav>
</aside>

<main id="main">
  <article id="entry">
    <p class="muted">加载中…</p>
  </article>
</main>

<script type="module" src="assets/app.js"></script>
</body>
</html>
